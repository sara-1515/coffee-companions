<!DOCTYPE html>
<html>
    <head>
        <title>Coffee Companions - Coffee Quiz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Find your perfect coffee match with our coffee personality quiz">
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #251313;
                font-family: Arial, sans-serif;
                color: #ffffff;
                margin: 0;
                padding: 0;
            }

            .header {
                background-color: #1a0d0d;
                text-align: center;
                padding: 30px 0;
            }

            .header h1 {
                font-family: 'Dancing Script', cursive;
                color: #d9b582;
                font-size: 48px;
                margin: 0;
            }

            .header a {
                color: #ffffff;
                text-decoration: none;
                font-size: 18px;
                margin-top: 15px;
                display: inline-block;
                transition: color 0.3s ease;
            }

            .header a:hover {
                color: #d9b582;
            }

            .quiz-container {
                max-width: 600px;
                margin: 40px auto;
                background-color: #3a2121;
                border-radius: 20px;
                padding: 30px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .quiz-header {
                font-family: 'Dancing Script', cursive;
                font-size: 36px;
                color: #d9b582;
                text-align: center;
                margin-bottom: 20px;
            }

            .quiz-progress {
                height: 10px;
                background-color: #1a0d0d;
                border-radius: 5px;
                margin-bottom: 30px;
                overflow: hidden;
            }

            .quiz-progress-bar {
                height: 100%;
                background-color: #d9b582;
                border-radius: 5px;
                transition: width 0.3s ease;
            }

            .question {
                font-size: 22px;
                margin-bottom: 20px;
                color: #ffffff;
            }

            .answers {
                display: flex;
                flex-direction: column;
                gap: 15px;
                margin-bottom: 30px;
            }

            .answer-btn {
                background-color: #251313;
                color: #ffffff;
                border: 2px solid #d9b582;
                border-radius: 10px;
                padding: 15px 20px;
                font-size: 18px;
                cursor: pointer;
                transition: all 0.3s ease;
                text-align: left;
            }

            .answer-btn:hover {
                background-color: #d9b582;
                color: #251313;
                transform: translateY(-3px);
            }

            .quiz-result {
                text-align: center;
            }

            .result-image {
                width: 200px;
                height: 200px;
                object-fit: cover;
                border-radius: 50%;
                margin: 0 auto 20px;
                border: 5px solid #d9b582;
            }

            .result-title {
                font-family: 'Dancing Script', cursive;
                font-size: 32px;
                color: #d9b582;
                margin-bottom: 15px;
            }

            .result-description {
                font-size: 18px;
                color: #ffffff;
                margin-bottom: 30px;
                line-height: 1.6;
            }

            .quiz-btn {
                background-color: #d9b582;
                color: #251313;
                border: none;
                border-radius: 10px;
                padding: 12px 25px;
                font-size: 18px;
                cursor: pointer;
                transition: all 0.3s ease;
                font-weight: bold;
                margin: 10px;
            }

            .quiz-btn:hover {
                background-color: #ffffff;
                transform: translateY(-3px);
            }

            .hidden {
                display: none;
            }

            footer {
                background-color: #1a0d0d;
                color: #d9b582;
                padding: 20px;
                text-align: center;
                margin-top: 40px;
            }

            footer p {
                margin: 0;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Coffee Companions</h1>
            <a href="index.html">← Back to Home</a>
        </div>

        <div class="quiz-container" id="coffee-quiz">
            <!-- Quiz Content -->
            <div id="quiz-content">
                <h2 class="quiz-header">Find Your Perfect Coffee Match</h2>
                <div class="quiz-progress">
                    <div class="quiz-progress-bar" id="progress-bar"></div>
                </div>
                <div class="question" id="question"></div>
                <div class="answers" id="answers"></div>
            </div>
            
            <!-- Result Content -->
            <div id="result-content" class="quiz-result hidden">
                <h2 class="quiz-header">Your Perfect Coffee Match</h2>
                <img class="result-image" id="result-image" src="" alt="Coffee result">
                <h3 class="result-title" id="result-title"></h3>
                <p class="result-description" id="result-description"></p>
                <div>
                    <button class="quiz-btn" id="retake-btn">Take Quiz Again</button>
                    <button class="quiz-btn" id="home-btn">Back to Home</button>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 Coffee Companions. All Rights Reserved.</p>
        </footer>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Coffee quiz data
                const questions = [
                    {
                        question: "How do you like your coffee flavor?",
                        answers: ["Bright and fruity", "Balanced and smooth", "Bold and earthy", "Mild and sweet"]
                    },
                    {
                        question: "What's your preferred brewing method?",
                        answers: ["Pour-over", "Drip machine", "French press", "Espresso"]
                    },
                    {
                        question: "Do you add anything to your coffee?",
                        answers: ["Nothing, black only", "Just a splash of milk", "Milk and sugar", "Alternative milks (oat, almond, etc.)"]
                    },
                    {
                        question: "When do you typically enjoy coffee?",
                        answers: ["First thing in the morning", "Throughout the day", "After meals", "Evening relaxation"]
                    }
                ];

                const results = {
                    ethiopian: {
                        name: "Ethiopian Yirgacheffe",
                        image: "./images/ethiopian.jpeg",
                        description: "This light-roasted coffee offers a delightful complexity with bright citrus notes and floral undertones. The distinctive blueberry aroma is unmistakable, and it finishes with a pleasant tea-like quality."
                    },
                    colombian: {
                        name: "Colombian Supremo",
                        image: "./images/columbian.jpeg",
                        description: "A well-balanced medium roast with nutty undertones and caramel sweetness. The chocolate notes come through nicely with minimal acidity, making it approachable for daily drinking."
                    },
                    sumatra: {
                        name: "Sumatra Mandheling",
                        image: "./images/sumatra.jpeg",
                        description: "This dark roast delivers a full-bodied experience with earthy, woody characteristics. The low acidity and hints of spice make it distinctive, while its rich, syrupy body stands up well to milk."
                    },
                    jamaican: {
                        name: "Jamaican Blue Mountain",
                        image: "./images/jamaican.jpeg",
                        description: "A premium coffee known for its exceptional smoothness and clean taste profile. Offers subtle notes of chocolate and a mild, sweet flavor with virtually no bitterness."
                    }
                };

                // Quiz variables
                let currentQuestion = 0;
                let userAnswers = [];
                
                // Quiz elements
                const quizContainer = document.getElementById('coffee-quiz');
                const questionEl = document.getElementById('question');
                const answersEl = document.getElementById('answers');
                const progressBarEl = document.getElementById('progress-bar');
                const quizContentEl = document.getElementById('quiz-content');
                const resultContentEl = document.getElementById('result-content');
                const resultImageEl = document.getElementById('result-image');
                const resultTitleEl = document.getElementById('result-title');
                const resultDescEl = document.getElementById('result-description');
                const retakeBtn = document.getElementById('retake-btn');
                const homeBtn = document.getElementById('home-btn');
                
                // Initialize quiz
                function initQuiz() {
                    currentQuestion = 0;
                    userAnswers = [];
                    showQuestion();
                    quizContentEl.classList.remove('hidden');
                    resultContentEl.classList.add('hidden');
                }
                
                // Show current question
                function showQuestion() {
                    // Update progress bar
                    progressBarEl.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
                    
                    // Set question text
                    questionEl.textContent = questions[currentQuestion].question;
                    
                    // Clear previous answers
                    answersEl.innerHTML = '';
                    
                    // Add answer buttons
                    questions[currentQuestion].answers.forEach((answer, index) => {
                        const button = document.createElement('button');
                        button.classList.add('answer-btn');
                        button.textContent = answer;
                        button.addEventListener('click', () => selectAnswer(index));
                        answersEl.appendChild(button);
                    });
                }
                
                // Handle answer selection
                function selectAnswer(answerIndex) {
                    userAnswers.push(answerIndex);
                    
                    if (currentQuestion < questions.length - 1) {
                        currentQuestion++;
                        showQuestion();
                    } else {
                        showResult();
                    }
                }
                
                // Show quiz result
                function showResult() {
                    // Simple algorithm to determine coffee type based on answers
                    // This is a simplified version - you might want a more sophisticated matching algorithm
                    let result;
                    
                    // Count the frequency of each answer index (0-3)
                    const answerCounts = [0, 0, 0, 0];
                    userAnswers.forEach(answer => answerCounts[answer]++);
                    
                    // Find the most frequent answer
                    const maxCount = Math.max(...answerCounts);
                    const mostFrequent = answerCounts.indexOf(maxCount);
                    
                    // Map to coffee type
                    switch(mostFrequent) {
                        case 0: result = results.ethiopian; break;
                        case 1: result = results.colombian; break;
                        case 2: result = results.sumatra; break;
                        case 3: result = results.jamaican; break;
                        default: result = results.colombian; // Default fallback
                    }
                    
                    // Update result elements
                    resultImageEl.src = result.image;
                    resultTitleEl.textContent = result.name;
                    resultDescEl.textContent = result.description;
                    
                    // Show result section
                    quizContentEl.classList.add('hidden');
                    resultContentEl.classList.remove('hidden');
                }
                
                // Event listener for retake button
                retakeBtn.addEventListener('click', initQuiz);
                
                // Event listener for home button
                homeBtn.addEventListener('click', function() {
                    window.location.href = 'index.html';
                });
                
                // Start the quiz when loaded
                initQuiz();
            });
        </script>
    </body>
</html>
